[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-data-lake-fs"
version = "0.1.0"
description = "Wrapper library for Azure Data Lake with ACL redaction, SAS indirection, and Service Bus observation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Skitionek" }]
dependencies = [
  "azure-storage-file-datalake>=12.19.0",
  "azure-servicebus>=7.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
